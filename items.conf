# One line per published item: <item folder> <kind> <mods...> [layout:<name>] [keys]
# kind is "mod" or "layout". "keys" means the item has its own keys.json in the repo
# (hand-written, never synced). Mods/layouts are copied from ~/.config/herdr-app.
git        mod     git
leader     mod     leader keys
todos      mod     todos
servers    mod     servers
skills     mod     skills
my-agents  mod     my-agents
my-files   mod     my-files
my-tabs    mod     my-tabs
my-main    layout  my-agents my-files my-tabs git skills todos servers layout:my-main
