# One line per published item: <item folder> <kind> <mods...> [layout:<name>] [keys]
# kind is "mod" or "layout". "keys" means the item has its own keys.json in the repo
# (hand-written, never synced). Mods/layouts are copied from ~/.config/herdr-app.
git         mod     git
leader      mod     leader keys
todos       mod     todos
servers     mod     servers
remote-checker mod  remote-checker
skills      mod     skills
pond-agents mod     pond-agents
pond-files  mod     pond-files
pond-tabs   mod     pond-tabs
pond        layout  pond-agents pond-files pond-tabs git skills todos servers remote-checker layout:pond
