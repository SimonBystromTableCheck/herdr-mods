# One line per published item: <item folder> <kind> <mods...> [layout:<name>] [keys]
# kind is "mod" or "layout". "keys" means the item has its own keys.json in the repo
# (hand-written, never synced). Mods/layouts are copied from ~/.config/herdr-app.
git         mod     git git-conflicts
leader      mod     leader keys
todos       mod     todos
servers     mod     servers
remote-checker mod  remote-checker
skills      mod     skills
pond-agents mod     pond-agents
pond-files  mod     pond-files
pond-tabs   mod     pond-tabs
pond-profiles mod   pond-profiles
workbench   mod     workbench
notes       mod     notes
pond-settings mod   pond-settings
pond-pins   mod     pond-pins
# From github.com/anthonychape-tc/herdr-pond (published here with his OK); pond-chrome,
# pond-sidebar and agent-chat started from azaeldrm's harns-layout (MIT, LICENSE in each folder).
pond-chrome mod     pond-chrome
pond-sidebar mod    pond-sidebar
pond-usage  mod     pond-usage
agent-chat  mod     agent-chat
# Session history: Anthony Chapé's mod from github.com/anthonychape-tc/herdr-pond (published with his OK).
pond-history mod    pond-history
space-editor mod    space-editor
pond        layout  pond-agents pond-files pond-tabs git git-conflicts skills todos servers remote-checker pond-profiles workbench notes pond-settings layout:pond
pond-tree   layout  pond-chrome pond-history pond-sidebar space-editor pond-usage agent-chat pond-pins pond-settings pond-tabs pond-profiles pond-agents pond-files git git-conflicts skills todos servers remote-checker workbench notes layout:pond-tree
