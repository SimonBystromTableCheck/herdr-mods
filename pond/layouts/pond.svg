<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- pond: spaces/agents sidebar, tab bar, a focused pane card, the right panel, status bar -->
  <rect width="320" height="200" fill="#141619"/>
  <rect x="0" y="0" width="58" height="200" fill="#1b1e23"/>
  <rect x="58" y="0" width="1" height="200" fill="#2a2e35"/>
  <!-- traffic lights + brand -->
  <g fill="#3d424a"><circle cx="8" cy="9" r="2.5"/><circle cx="16" cy="9" r="2.5"/><circle cx="24" cy="9" r="2.5"/></g>
  <rect x="32" y="6" width="18" height="6" rx="2" fill="#2a2e35"/>
  <!-- spaces -->
  <g fill="#2c313a"><rect x="8" y="26" width="42" height="9" rx="2"/></g>
  <rect x="8" y="26" width="42" height="9" rx="2" fill="#2b3a4f"/>
  <g fill="#23272e"><rect x="8" y="39" width="42" height="9" rx="2"/><rect x="8" y="52" width="42" height="9" rx="2"/></g>
  <g fill="#4b8fd6"><circle cx="13" cy="30.5" r="2"/></g>
  <g fill="#6d7580"><circle cx="13" cy="43.5" r="2"/><circle cx="13" cy="56.5" r="2"/></g>
  <g fill="#2f343d"><rect x="18" y="29" width="26" height="3" rx="1.5"/><rect x="18" y="42" width="22" height="3" rx="1.5"/><rect x="18" y="55" width="24" height="3" rx="1.5"/></g>
  <!-- agents -->
  <g fill="#23272e"><rect x="8" y="74" width="42" height="9" rx="2"/><rect x="8" y="87" width="42" height="9" rx="2"/></g>
  <g fill="#3fbf7f"><circle cx="13" cy="78.5" r="2.2"/></g>
  <g fill="#e0b341"><circle cx="13" cy="91.5" r="2.2"/></g>
  <g fill="#2f343d"><rect x="18" y="77" width="24" height="3" rx="1.5"/><rect x="18" y="90" width="20" height="3" rx="1.5"/></g>
  <!-- sysstat + footer -->
  <g fill="#2c313a"><rect x="8" y="150" width="4" height="8" rx="1"/><rect x="14" y="147" width="4" height="11" rx="1"/><rect x="20" y="151" width="4" height="7" rx="1"/><rect x="26" y="149" width="4" height="9" rx="1"/></g>
  <g fill="#2a2e35"><rect x="8" y="172" width="30" height="4" rx="2"/><rect x="8" y="180" width="22" height="4" rx="2"/></g>
  <!-- tab bar -->
  <g fill="#23272e"><rect x="70" y="10" width="26" height="10" rx="3"/><rect x="100" y="10" width="20" height="10" rx="3"/></g>
  <rect x="70" y="10" width="26" height="10" rx="3" fill="#2f3a49"/>
  <g fill="#2a2e35"><rect x="70" y="24" width="240" height="1"/></g>
  <!-- focused pane card -->
  <rect x="66" y="30" width="132" height="150" rx="5" fill="#191c21" stroke="#4b8fd6" stroke-width="1.5"/>
  <rect x="66" y="30" width="132" height="12" rx="5" fill="#1f232a"/>
  <g fill="#3a4048"><rect x="72" y="34" width="18" height="3" rx="1.5"/><rect x="96" y="34" width="12" height="3" rx="1.5"/></g>
  <g fill="#2c313a"><rect x="74" y="50" width="70" height="3" rx="1.5"/><rect x="74" y="57" width="52" height="3" rx="1.5"/><rect x="74" y="64" width="62" height="3" rx="1.5"/><rect x="74" y="71" width="40" height="3" rx="1.5"/></g>
  <rect x="74" y="82" width="46" height="3" rx="1.5" fill="#4b8fd6"/>
  <g fill="#2c313a"><rect x="74" y="89" width="56" height="3" rx="1.5"/><rect x="74" y="96" width="48" height="3" rx="1.5"/><rect x="74" y="103" width="66" height="3" rx="1.5"/><rect x="74" y="110" width="34" height="3" rx="1.5"/></g>
  <!-- right panel -->
  <rect x="206" y="30" width="108" height="150" rx="5" fill="#1b1e23" stroke="#2f343d" stroke-width="1"/>
  <rect x="206" y="30" width="108" height="14" rx="5" fill="#20242b"/>
  <g fill="#3a4048"><rect x="212" y="35" width="14" height="4" rx="2"/></g>
  <g fill="#2c313a"><rect x="212" y="50" width="96" height="1"/><rect x="212" y="60" width="40" height="3" rx="1.5"/><rect x="212" y="67" width="60" height="3" rx="1.5"/><rect x="212" y="74" width="52" height="3" rx="1.5"/><rect x="212" y="81" width="66" height="3" rx="1.5"/></g>
  <rect x="212" y="92" width="96" height="1" fill="#2c313a"/>
  <g fill="#2c313a"><rect x="212" y="102" width="34" height="3" rx="1.5"/><rect x="212" y="109" width="58" height="3" rx="1.5"/><rect x="212" y="116" width="48" height="3" rx="1.5"/></g>
  <g fill="#4b8fd6"><rect x="212" y="127" width="3" height="3" rx="1"/></g>
  <g fill="#2c313a"><rect x="219" y="127" width="44" height="3" rx="1.5"/><rect x="212" y="134" width="3" height="3" rx="1"/><rect x="219" y="134" width="38" height="3" rx="1.5"/></g>
  <!-- status bar -->
  <rect x="0" y="188" width="320" height="12" fill="#1b1e23"/>
  <rect x="0" y="188" width="320" height="1" fill="#2a2e35"/>
  <g fill="#3a4048"><rect x="8" y="192" width="30" height="3" rx="1.5"/><rect x="44" y="192" width="18" height="3" rx="1.5"/></g>
  <g fill="#4b8fd6"><rect x="300" y="192" width="12" height="3" rx="1.5"/></g>
</svg>
